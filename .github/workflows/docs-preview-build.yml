name: Docs preview build

# Builds documentation PRs without credentials; the trusted publisher on the default branch
# publishes the result. Keep this file name: the publisher trusts only this workflow file.
on:
  pull_request:
    branches: [gh-pages]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    uses: DiRoots-Limited/DiRoots.Public.Workflows/.github/workflows/docs-preview-build.yml@8ba2b9bc6aa6f518e6e6df7b69ee041b21b80f15 # v1
    with:
      # Public docs site URL, including any project path.
      site-url: https://diroots-mauro.github.io/DiRoots.Sandbox.ProSheets.Releases
    # No secrets mapping and never secrets: inherit.
