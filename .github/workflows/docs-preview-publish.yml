name: Docs preview publish

# Trusted publisher for documentation PR previews. The default-branch copy handles publishing
# (workflow_run) and the daily reconcile; the gh-pages copy removes previews as soon as a PR
# closes (pull_request_target is read from the PR base branch).
on:
  workflow_run:
    workflows: [Docs preview build]
    types: [completed]
  pull_request_target:
    branches: [gh-pages]
    types: [closed]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: DiRoots-Limited/DiRoots.Public.Workflows/.github/workflows/docs-preview-publish.yml@develop
    with:
      site-url: https://diroots-mauro.github.io/DiRoots.Sandbox.ProSheets.Releases
      app-id: ${{ vars.DOCS_PREVIEW_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.DOCS_PREVIEW_APP_PRIVATE_KEY }}
